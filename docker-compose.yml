services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: gestion-escolar-php:8.2.33
    container_name: gestion-escolar-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=gestion_escolar
      - DB_USERNAME=gestion_escolar
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
    depends_on:
      - mysql
      - redis
    networks:
      - gestion-escolar

  nginx:
    image: nginx:1.27.5
    container_name: gestion-escolar-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - gestion-escolar

  mysql:
    image: mysql:8.0.46-oraclelinux9
    container_name: gestion-escolar-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=gestion_escolar
      - MYSQL_USER=gestion_escolar
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=rootsecret
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - gestion-escolar

  node:
    image: node:20.17.0-alpine
    container_name: gestion-escolar-node
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app
    networks:
      - gestion-escolar

  redis:
    image: redis:7.4.10-alpine
    container_name: gestion-escolar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - gestion-escolar

volumes:
  mysql-data:
  redis-data:

networks:
  gestion-escolar:
    driver: bridge
